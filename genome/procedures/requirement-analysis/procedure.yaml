id: requirement-analysis
version: 1.2.0
summary: 读需求与项目地图,产出这次要动哪些模块、验收标准与预估风险;拆不动时产出拆分提案
kind: agentic
ownership: plan
trigger:
  states:
  - CREATED
inputs:
  schema:
    type: object
    required:
    - requirement
    properties:
      requirement:
        type: string
      task_id:
        type: string
outputs:
  schema_ref: schemas/out.json
compat:
  runtimes:
  - claude-code
  - agentteams
